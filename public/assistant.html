<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NTEK AI Assistant</title>
<style>
:root{--navy:#0b1f3a;--blue:#1769e0;--blue2:#155dc9;--bg:#f5f7fb;--line:#e2e8f0;--muted:#667085;--ink:#172033}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink)}
.wrap{width:min(1050px,100%);min-height:100vh;margin:auto;padding:24px;display:flex;flex-direction:column}.top{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:16px}.brand{display:flex;align-items:center;gap:12px}.mark{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--blue),#5b9bf4);color:#fff;display:grid;place-items:center;font-weight:900;box-shadow:0 8px 20px #1769e033}.top h1{margin:0;font-size:25px}.hint{margin:4px 0 0;color:var(--muted);font-size:13px}.top-actions{display:flex;gap:8px;align-items:center}.close,.minimize{width:40px;height:40px;padding:0;border-radius:11px;font-size:22px;line-height:1;background:#fff;color:#344054;border:1px solid var(--line);cursor:pointer;transition:.18s;display:grid;place-items:center}.close:hover{background:#fff1f0;color:#b42318;border-color:#f0c7c2;transform:rotate(4deg) scale(1.03)}.minimize:hover{background:#f0f6ff;color:#1455a3;border-color:#b9d1f5;transform:translateY(-1px)}
.chat{flex:1;min-height:58vh;overflow:auto;background:linear-gradient(180deg,#fbfcff,#f5f7fb);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 10px 30px #10233f12}.msg{max-width:78%;padding:13px 16px;border-radius:16px;margin:10px 0;white-space:pre-wrap;line-height:1.55;word-break:break-word;box-shadow:0 2px 8px #10233f0a}.user{margin-left:auto;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;border-bottom-right-radius:5px}.ai{background:#fff;border:1px solid var(--line);border-bottom-left-radius:5px}.typing{display:inline-flex;gap:4px;align-items:center}.typing i{width:5px;height:5px;background:#98a2b3;border-radius:50%;animation:b 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}@keyframes b{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-4px)}}
.composer{display:flex;gap:10px;margin-top:14px;align-items:flex-end;background:#fff;border:1px solid var(--line);border-radius:15px;padding:10px;box-shadow:0 8px 24px #10233f0c}.composer textarea{flex:1;min-height:48px;max-height:140px;resize:none;border:1px solid #d5dce6;border-radius:11px;padding:12px;font:inherit;outline:none}.composer textarea:focus{border-color:#77a8ee;box-shadow:0 0 0 4px #1769e014}.btn{border:1px solid transparent;border-radius:10px;padding:11px 16px;background:var(--blue);color:#fff;font-weight:750;cursor:pointer;transition:.18s}.btn:hover:not(:disabled){background:var(--blue2);transform:translateY(-1px);box-shadow:0 7px 18px #1769e033}.btn.secondary{background:#f0f3f7;color:#18304f;border-color:#e0e6ee}.btn:disabled{opacity:.5;cursor:not-allowed}.send{height:48px;min-width:78px}.tools{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.chip{border:1px solid #dfe5ed;background:#fff;color:#344054;border-radius:999px;padding:7px 11px;font-size:12px;font-weight:650;cursor:pointer}.chip:hover{border-color:#a9c6ef;background:#f0f6ff;color:#1455a3}
body.minimized .chat,body.minimized .tools,body.minimized .composer{display:none}body.minimized .wrap{min-height:auto}.toast{position:fixed;right:20px;bottom:20px;background:#12243d;color:#fff;padding:10px 14px;border-radius:10px;display:none;box-shadow:0 10px 25px #0002;font-size:13px;z-index:20}
@media(max-width:650px){.wrap{padding:14px 12px 18px}.top{align-items:flex-start}.top h1{font-size:21px}.hint{font-size:12px}.chat{min-height:62vh;padding:14px}.msg{max-width:88%;padding:12px 13px}.composer{position:sticky;bottom:0}.send{width:48px;min-width:48px;padding:0;font-size:0}.send:after{content:"➤";font-size:17px}.tools{overflow:auto;flex-wrap:nowrap}.chip{white-space:nowrap}.close,.minimize{width:38px;height:38px}}
</style>
</head>
<body>
<main class="wrap">
<div class="top"><div class="brand"><div class="mark">✦</div><div><h1>NTEK AI Assistant</h1><p class="hint">Draft, rewrite, analyse, brainstorm and handle eBay work in English or Roman Urdu.</p></div></div><div class="top-actions"><button class="btn secondary" id="clear" type="button">New Chat</button><button class="minimize" id="minimizeAssistant" type="button" aria-label="Minimize assistant" title="Minimize">−</button><button class="close" id="closeAssistant" type="button" aria-label="Close assistant" title="Close">×</button></div></div>
<div class="chat" id="chat"></div>
<div class="tools"><button class="chip" data-prompt="Write a professional eBay buyer reply for this message: ">Draft buyer reply</button><button class="chip" data-prompt="Improve this eBay product title: ">Improve title</button><button class="chip" data-prompt="Rewrite this professionally: ">Rewrite</button><button class="chip" data-prompt="Analyse this buyer message and tell me what the best response/action is: ">Analyse buyer</button></div>
<div class="composer"><textarea id="input" rows="2" placeholder="e.g. Is buyer ke liye professional reply banao..."></textarea><button class="btn send" id="send" type="button">Send</button></div>
</main><div class="toast" id="toast"></div>
<script>
const chat=document.getElementById('chat'),input=document.getElementById('input'),sendBtn=document.getElementById('send'),toast=document.getElementById('toast');let messages=[];let busy=false;
function notify(t){toast.textContent=t;toast.style.display='block';clearTimeout(window.__toast);window.__toast=setTimeout(()=>toast.style.display='none',1600)}
function add(role,text,typing=false){const d=document.createElement('div');d.className='msg '+role;if(typing)d.innerHTML='<span class="typing"><i></i><i></i><i></i></span>';else d.textContent=text;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d}
function save(){localStorage.setItem('ntekAssistantChat',JSON.stringify(messages.slice(-30)))}
function load(){try{messages=JSON.parse(localStorage.getItem('ntekAssistantChat')||'[]')}catch{messages=[]}if(!messages.length){add('ai','Hi! Main NTEK AI Assistant hoon. Jo kaam karwana ho Roman Urdu ya English mein bata dein.');return}messages.forEach(m=>add(m.role,m.content))}
function newChat(){if(busy)return;messages=[];localStorage.removeItem('ntekAssistantChat');chat.innerHTML='';add('ai','New chat started. Bataiye kya kaam karna hai?');input.focus();notify('New chat started')}
function minimizeAssistant(){document.body.classList.toggle('minimized');const minimized=document.body.classList.contains('minimized');document.getElementById('minimizeAssistant').textContent=minimized?'+':'−';document.getElementById('minimizeAssistant').title=minimized?'Restore':'Minimize';notify(minimized?'Assistant minimized':'Assistant restored')}
function closeAssistant(){if(busy){notify('Please wait for the current response to finish.');return}window.location.assign('/');setTimeout(()=>{if(location.pathname!=='/')location.href='/'},250)}
async function send(){const text=input.value.trim();if(!text||busy)return;busy=true;input.value='';input.style.height='48px';if(document.body.classList.contains('minimized'))minimizeAssistant();add('user',text);messages.push({role:'user',content:text});save();const thinking=add('ai','',true);sendBtn.disabled=true;try{const conversation=messages.slice(-12);const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,conversation,context:'NTEK eBay support workspace. Respond naturally and directly; follow the user task rather than giving generic advice.'})});let d;try{d=await r.json()}catch{throw Error('Invalid server response.')}if(!r.ok)throw Error(d.error||'Request failed');thinking.remove();add('ai',d.reply);messages.push({role:'assistant',content:d.reply});save()}catch(e){thinking.textContent=e.message||'Unable to respond right now.'}finally{busy=false;sendBtn.disabled=false;input.focus()}}
sendBtn.onclick=send;document.getElementById('clear').onclick=newChat;document.getElementById('minimizeAssistant').onclick=minimizeAssistant;document.getElementById('closeAssistant').onclick=closeAssistant;input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});input.addEventListener('input',()=>{input.style.height='48px';input.style.height=Math.min(input.scrollHeight,140)+'px'});document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{if(document.body.classList.contains('minimized'))minimizeAssistant();input.value=b.dataset.prompt;input.focus();input.setSelectionRange(input.value.length,input.value.length)});load();
</script>
</body></html>
