<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NTEK AI Assistant</title><style>body{margin:0;font-family:Inter,system-ui,Arial;background:#f3f6fa;color:#172033}.wrap{max-width:900px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center}.chat{height:65vh;overflow:auto;background:#fff;border:1px solid #e1e7ef;border-radius:16px;padding:20px;box-shadow:0 5px 20px #14233c0a}.msg{max-width:78%;padding:12px 15px;border-radius:14px;margin:10px 0;white-space:pre-wrap;line-height:1.5}.user{margin-left:auto;background:#1769e0;color:white}.ai{background:#f1f4f8}.composer{display:flex;gap:10px;margin-top:14px}.composer textarea{flex:1;resize:none;border:1px solid #d5dce6;border-radius:12px;padding:13px;font:inherit}.btn{border:0;border-radius:10px;padding:11px 16px;background:#1769e0;color:#fff;font-weight:700;cursor:pointer}.btn.secondary{background:#eaf0f7;color:#18304f}.hint{color:#667085;font-size:13px}</style></head><body><main class="wrap"><div class="top"><div><h1>NTEK AI Assistant</h1><p class="hint">Tell the AI what you want done. It can draft, rewrite, explain, brainstorm and help with eBay work.</p></div><button class="btn secondary" id="clear">New Chat</button></div><div class="chat" id="chat"></div><div class="composer"><textarea id="input" rows="2" placeholder="e.g. Is buyer ke liye professional reply banao..."></textarea><button class="btn" id="send">Send</button></div></main><script>const chat=document.getElementById('chat'),input=document.getElementById('input');let messages=[];function add(role,text){const d=document.createElement('div');d.className='msg '+role;d.textContent=text;chat.appendChild(d);chat.scrollTop=chat.scrollHeight}function save(){localStorage.setItem('ntekAssistantChat',JSON.stringify(messages))}function load(){messages=JSON.parse(localStorage.getItem('ntekAssistantChat')||'[]');if(!messages.length)add('ai','Hi! Main NTEK AI Assistant hoon. Jo kaam karwana ho Roman Urdu ya English mein bata dein.');messages.forEach(m=>add(m.role,m.content))}async function send(){const text=input.value.trim();if(!text)return;input.value='';add('user',text);messages.push({role:'user',content:text});save();add('ai','Thinking…');const thinking=chat.lastChild;try{const r=await fetch('/api/assistant',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages})});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');thinking.remove();add('ai',d.reply);messages.push({role:'assistant',content:d.reply});save()}catch(e){thinking.textContent=e.message}}document.getElementById('send').onclick=send;input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});document.getElementById('clear').onclick=()=>{messages=[];localStorage.removeItem('ntekAssistantChat');chat.innerHTML='';add('ai','New chat started. Bataiye kya kaam karna hai?')};load();</script></body></html>
